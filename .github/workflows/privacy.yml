name: Privacy policy

# The policy is published in three places from one source file. This fails the push if the
# generated artifacts no longer match AsteraDev/Resources/PrivacyPolicy.md, which is what stops
# the app and the URL in App Store Connect drifting apart.

on:
  push:
    paths:
      - 'AsteraDev/Resources/PrivacyPolicy.md'
      - 'docs/privacy/index.html'
      - 'PRIVACY.md'
      - 'scripts/build_privacy.py'
      - '.github/workflows/privacy.yml'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_privacy.py --check
