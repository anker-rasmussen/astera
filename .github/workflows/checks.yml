name: Checks

on:
  push:
  pull_request:

jobs:
  # Fast, dependency-free, runs on Linux. Guards against the same fact being written down twice
  # and the copies disagreeing.
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The privacy policy is published in three places from one source file.
      - name: Privacy artifacts are current
        run: python3 scripts/build_privacy.py --check

      # Product IDs, prices, durations, legal URLs, and the shipping version are restated in the
      # App Store paperwork. They have to match what the app declares.
      - name: App Store metadata matches the app
        run: python3 scripts/check_consistency.py

  # Unit tests and the full end-to-end suite, on a simulator.
  tests:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # Runner images change their simulator lineup between Xcode releases, so discover what is
      # installed rather than hardcoding a model that may vanish.
      #
      # Prefer the smallest screen available, deliberately. This job happened to land on an
      # iPhone SE by accident and immediately failed two tests that pass on a large phone: a
      # Settings row that is comfortably in view on a 6.9" screen sits under the tab bar on a
      # 4.7" one. The tightest layout is the one worth running unattended, so the choice is now
      # made on purpose instead of by list order.
      - name: Pick a simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = [d["name"] for runtime in data if "iOS" in runtime
                    for d in data[runtime] if d["name"].startswith("iPhone")]
          if not phones:
              sys.exit("No iPhone simulators on this runner")
          # Smallest first: SE, then the non-Plus/Max/Pro models, then whatever is left.
          def size(name):
              if "SE" in name: return 0
              if "mini" in name: return 1
              if "Max" in name or "Plus" in name: return 4
              if "Pro" in name: return 3
              return 2
          print(sorted(set(phones), key=lambda n: (size(n), n))[0])
          ')
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      # Code signing is deliberately left enabled. Simulator builds sign ad-hoc and need no
      # certificate, and the entitlements that signing applies are what let CoreData+CloudKit
      # initialise. Disabling it made the app trap on launch before a single unit test ran.
      #
      # One worker: the hosted runner has less RAM than a laptop, and each parallel worker is a
      # full simulator clone. Locally, two workers is fastest; see scripts/run_tests.sh.
      - name: Test
        run: |
          xcodebuild test \
            -project AsteraDev.xcodeproj \
            -scheme AsteraDev \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            | xcpretty && exit ${PIPESTATUS[0]}

      # The bundle holds the failure screenshots XCUITest captures automatically, which is the
      # only way to see what a UI failure actually looked like on a machine you cannot open.
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
