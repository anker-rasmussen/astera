name: AsteraDev
options:
  bundleIdPrefix: com.anker
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: "4QF4AHTV9B"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  AsteraDev:
    type: application
    platform: iOS
    sources:
      - path: AsteraDev
        excludes:
          - "AsteraDev.entitlements"
          - "Info.plist"
      - path: AsteraDev/AsteraDev.entitlements
        buildPhase: none
      - path: AsteraDev/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anker.astera
        PRODUCT_NAME: Astera
        CODE_SIGN_ENTITLEMENTS: AsteraDev/AsteraDev.entitlements
        INFOPLIST_FILE: AsteraDev/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AsteraDevTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AsteraDevTests
    dependencies:
      - target: AsteraDev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anker.astera.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Astera.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Astera"

schemes:
  AsteraDev:
    build:
      targets:
        AsteraDev: all
        AsteraDevTests: [test]
    test:
      targets:
        - AsteraDevTests
    run:
      config: Debug
    archive:
      config: Release
